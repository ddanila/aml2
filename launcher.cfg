# aml2 sample configuration
# Format: Name|Command|Working Directory
#
# Optional settings (one per line, before the entries):
#   bigtext = on    Default. Big text via standard VGA timing (8-dot at
#                   25.175 MHz, 31.47 kHz horizontal).
#   bigtext = svga  Big text via the card's native dot clock. Use this if
#                   your monitor shows "out of range" with bigtext = on.
#   bigtext = wide  Big-font glyphs in the default 9-dot wide cells, no
#                   VGA-timing changes. Use if neither of the above works.

DOS Shell|command.com|C:\
Norton Commander|nc.exe|C:\NC
Turbo Pascal|tp.exe|C:\TP
